[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunex-nexus-protocol"
version = "0.0.3.dev0"
description = "Shared M-EVI register decoding and verified setpoint transport"
requires-python = ">=3.11"
dependencies = ["pymodbus==3.13.1"]
license = "MIT"

[tool.setuptools]
packages = ["sunex_nexus_protocol"]

[tool.setuptools.package-dir]
sunex_nexus_protocol = "custom_components/sunex_nexus/protocol"

[tool.setuptools.package-data]
sunex_nexus_protocol = ["catalog.json"]
